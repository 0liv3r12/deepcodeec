<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var redirect = params.get('redirect');
      if (redirect) {
        window.history.replaceState(null, '', redirect);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- GitHub Pages no permite cabeceras HTTP: lo que se puede va por meta. -->
  <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>DeepCodeEc | Software a medida</title>
  <meta name="description"
    content="DeepCodeEc crea software a medida: sitios web, apps móviles, programas de escritorio y bases de datos para automatizar tu negocio. Loja, Ecuador." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="DeepCodeEc" />
  <meta property="og:locale" content="es_EC" />
  <meta property="og:url" content="https://deepcodeec.com/" />
  <meta property="og:title" content="DeepCodeEc | Software a medida" />
  <meta property="og:description"
    content="Sitios web, apps móviles, programas de escritorio y bases de datos que trabajan por tu negocio." />

  <meta property="og:image" content="https://deepcodeec.com/Icono.png" />
  <meta name="twitter:card" content="summary" />

  <!-- Pestaña (16–32 px): solo la D del logo, azul sobre cuadrado negro (favicon.svg + .ico).

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Fuentes alojadas en el sitio (subset latino de Google Fonts, licencia OFL) y

  <link rel="preload" href="%PUBLIC_URL%/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
